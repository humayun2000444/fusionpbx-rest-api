# /etc/systemd/system/xml_cdr.service.d/20-shards.conf -- installed by install.sh in this folder.
#
# Makes the main importer shard 0 of XML_CDR_SHARDS. If /etc/default/xml_cdr-shards
# is missing, shards= is empty and the importer falls back to taking every file.
[Service]
EnvironmentFile=-/etc/default/xml_cdr-shards
ExecStart=
ExecStart=/usr/bin/php /var/www/fusionpbx/app/xml_cdr/resources/service/xml_cdr.php shard=0&shards=${XML_CDR_SHARDS}
