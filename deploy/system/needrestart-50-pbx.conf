# /etc/needrestart/conf.d/50-pbx.conf
#
# Never let unattended-upgrades restart the services that carry live calls or
# hold the database.
#
# On 2026-10-01 06:33 an openssl security update made needrestart restart
# freeswitch, postgresql, pgbouncer and xml_cdr in one instant. FreeSWITCH
# dropped every call in progress, and xml_cdr came up before Postgres was ready,
# failed to connect, and slept for 13 hours while 430,000 CDR files piled up.
# It recurs on any morning a library those services link against is updated.
#
# These still get the update installed; they keep running the old library until
# someone restarts them in a maintenance window. `needrestart -b` lists them.
$nrconf{override_rc}{qr(^freeswitch\.service$)} = 0;
$nrconf{override_rc}{qr(^postgresql.*\.service$)} = 0;
$nrconf{override_rc}{qr(^pgbouncer\.service$)} = 0;
