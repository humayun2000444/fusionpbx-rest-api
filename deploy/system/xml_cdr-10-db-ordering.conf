# /etc/systemd/system/xml_cdr.service.d/10-db-ordering.conf
#
# Start the CDR importer only after the database it needs. The shipped unit has
# these lines commented out, so when several services restart together the
# importer can come up first, fail to connect, and (without the bounded-reconnect
# patch) never recover. RestartSec stops a dead database turning
# StartLimitIntervalSec=0 into a tight restart loop.
[Unit]
After=postgresql.service postgresql@16-main.service pgbouncer.service
Wants=pgbouncer.service

[Service]
RestartSec=10
